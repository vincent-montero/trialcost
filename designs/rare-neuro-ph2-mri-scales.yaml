# Archetype 1 — rare neurological disease, phase 2, MRI + clinical scales (README §3).
# Same design as prototype/sanity_check.py, so the engine can be compared to it.
#
# Recruitment rate and dropout: ClinicalTrials.gov priors, rare neuro phase 2 subset
# (data/recruitment_priors.csv, grade C, D37-D38). Screen failure and rate_shape remain
# placeholders (grade D): CT.gov does not report them.
# activation_months is omitted: each country uses its range in data/countries.csv (D21).

name: rare-neuro-ph2-mri-scales
n_randomised: 50

arms:
  - {name: active, ratio: 1}
  - {name: placebo, ratio: 1, placebo: true}

# 52-week treatment + 4-week follow-up; patient duration = last visit day (392 d).
visits:
  - id: SCR
    day: -28
    screening: true
    procedures: [consent, inclusion_medical, labs_central_panel, blood_draw, sample_handling,
                 ecg, mri_brain, scale_clinician]
  - id: BL
    day: 0
    procedures: [physical_exam, labs_central_panel, blood_draw, sample_handling, scale_clinician,
                 scale_pro, pk_sample, pk_bioanalysis, drug_dispensing]
  - id: W4
    day: 28
    procedures: [physical_exam, labs_central_panel, blood_draw, sample_handling, scale_clinician]
  - id: W12
    day: 84
    procedures: [physical_exam, labs_central_panel, blood_draw, sample_handling, scale_clinician,
                 scale_pro, pk_sample, pk_bioanalysis, drug_dispensing]
  - id: W24
    day: 168
    procedures: [physical_exam, labs_central_panel, blood_draw, sample_handling, ecg, mri_brain,
                 scale_clinician, scale_pro, drug_dispensing]
  - id: W36
    day: 252
    remote: true
    procedures: [scale_pro, ae_review]
  - id: W52
    day: 364
    procedures: [physical_exam, labs_central_panel, blood_draw, sample_handling, ecg, mri_brain,
                 scale_clinician, scale_pro]
  - id: FU
    day: 392
    remote: true
    procedures: [ae_review]

countries:
  - {country: FR, n_sites: 4}
  - {country: DE, n_sites: 3}
  - {country: ES, n_sites: 3}
  - {country: IT, n_sites: 2}
  - {country: US, n_sites: 3}

population:
  screen_failure_rate: {kind: beta, mean: 0.35, kappa: 20}   # placeholder (D)
  annual_dropout_rate: {kind: beta, mean: 0.243, kappa: 2.42} # CT.gov prior, 34 trials
  rate_mean: {kind: lognormal, median: 0.401, gsd: 2.53}      # CT.gov prior, 114 trials; pts / open site / month
  rate_shape: 1.5                                             # placeholder (D)

operations:
  sponsor_model: full_cro
  monitoring: risk_based
  monitoring_interval_months: 2.0
  central_lab: true
  central_imaging_reading: true
  irt: true
  dmc: true
  n_interim_analyses: 0
  patient_travel_support: true
