[project]
name = "trialcost"
version = "0.1.0"
description = "Design-driven Monte Carlo estimator of clinical trial sponsor budgets"
authors = [
    { name = "Vincent Montero", email = "vincent_montero@icloud.com" }
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.6",
    "pandas>=3.1.1",
    "pydantic>=2.14.3",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["uv_build>=0.11.25,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["prototype", "*.md"]  # README §3 holds the agreed schema verbatim

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "PD", "SIM", "RUF"]
